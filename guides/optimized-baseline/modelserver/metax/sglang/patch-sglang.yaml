apiVersion: apps/v1
kind: Deployment
metadata:
  name: decode
spec:
  replicas: 1
  template:
    spec:
      hostIPC: true
      runtimeClassName: metax
      containers:
        - name: modelserver
          command: ["python3", "-m", "sglang.launch_server"]
          args:
            - "--model-path=Qwen/Qwen3-0.6B"
            - "--served-model-name=Qwen/Qwen3-0.6B"
            - "--host=0.0.0.0"
            - "--port=8000"
            - "--tensor-parallel-size=1"
            - "--mem-fraction-static=0.8"
            - "--trust-remote-code"
            - "--log-level=info"
            - "--enable-metrics"
          env:
            - name: HF_TOKEN
              valueFrom:
                secretKeyRef:
                  name: llm-d-hf-token
                  key: HF_TOKEN
            - name: UCX_TLS
              value: maca_ipc,maca_copy,tcp
            - name: UCX_PROTO_ENABLE
              value: "y"
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
            seccompProfile:
              type: Unconfined
          resources:
            limits:
              memory: 32Gi
              metax-tech.com/gpu: "1"
            requests:
              cpu: "2"
              memory: 8Gi
              metax-tech.com/gpu: "1"
          volumeMounts:
            - mountPath: /dev/shm
              name: dshm
          startupProbe:
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 180
          livenessProbe:
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 6
      volumes:
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
