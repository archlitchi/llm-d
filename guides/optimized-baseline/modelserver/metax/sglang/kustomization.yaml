apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../../recipes/modelserver/base/single-host/default

namePrefix: optimized-baseline-metax-sglang-

components:
  - ../../../../recipes/modelserver/components/images/metax-sglang/release

labels:
  - pairs:
      llm-d.ai/guide: optimized-baseline
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: metax
      llm-d.ai/engine-type: sglang
      llm-d.ai/model: Qwen3-0.6B
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-sglang.yaml
