apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../../recipes/modelserver/base/single-host/pd/sglang

namePrefix: pd-disaggregation-metax-sglang-

components:
  - ../../../../recipes/modelserver/components/images/metax-sglang/release
  - ../../../../recipes/modelserver/components/images/routing-sidecar/release

labels:
  - pairs:
      llm-d.ai/model: Qwen3-0.6B
      llm-d.ai/guide: pd-disaggregation
      llm-d.ai/accelerator-variant: gpu
      llm-d.ai/accelerator-vendor: metax
      llm-d.ai/engine-type: sglang
    includeSelectors: true
    includeTemplates: true
patches:
  - path: patch-decode.yaml
  - path: patch-prefill.yaml
